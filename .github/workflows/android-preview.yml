name: Android preview APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-preview.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build offline Android preview
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Block-Cypher-Android-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Block-Cypher-Android-preview
          path: Block-Cypher-Android-preview.apk
      - name: Publish downloadable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-preview-${{ github.run_number }}" Block-Cypher-Android-preview.apk --prerelease --title "Android preview ${{ github.run_number }}" --notes "Offline Android preview of the browser game. Requires Android 8 or later. Debug-signed testing build; not a production or Google Play release. Physical-device testing remains. A later preview may require uninstalling this build, which clears local saves."
